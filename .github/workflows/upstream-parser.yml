name: Upstream parser
# The re-sync lane. `cargo audit` and `cargo deny` do not see the vendored
# pulldown-cmark core, so this reads the newest release from crates.io and the
# RustSec advisories for the crate, compares both with the tag recorded in
# crates/rubrica-markdown/UPSTREAM, and on either difference opens (or updates)
# one issue with the upstream `src/` diff attached. The diff is reviewed and
# ported by hand, never merged blind.

on:
  schedule:
    - cron: "33 5 * * 2" # Tuesdays 05:33 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resync:
    name: Upstream pulldown-cmark
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # open or update the tracking issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Compare with upstream
        id: cmp
        run: |
          set -euo pipefail
          # The file arrives later; until then there is nothing to compare.
          if [ ! -f crates/rubrica-markdown/UPSTREAM ]; then
            echo "::notice::crates/rubrica-markdown/UPSTREAM does not exist yet; nothing to do"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # UPSTREAM's first line is `pulldown-cmark <version>`; the rest of the file is the
          # vendoring record (files, local edits, upstream sha256 sums).
          old="$(head -n 1 crates/rubrica-markdown/UPSTREAM | awk '{print $2}')"
          old="${old#v}"
          [[ "$old" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::UPSTREAM is not a version: '$old'"; exit 1; }

          # newer A B: A is a version strictly greater than B.
          newer() { [ "$1" != "$2" ] && [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -n1)" = "$1" ]; }

          new="$(curl -sSfL -H 'User-Agent: rubrica-upstream-parser (github.com/justin-stanley/rubrica)' \
            https://crates.io/api/v1/crates/pulldown-cmark | jq -r '.crate.max_stable_version')"
          [[ "$new" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::crates.io answered '$new'"; exit 1; }

          # Advisories whose `patched` list names a version newer than the recorded tag.
          git clone --quiet --depth 1 https://github.com/rustsec/advisory-db "$RUNNER_TEMP/advisory-db"
          advisories=""
          shopt -s nullglob
          for f in "$RUNNER_TEMP"/advisory-db/crates/pulldown-cmark/*.md; do
            patched="$(awk '/^patched = \[/ {on=1} on {print} on && /\]/ {exit}' "$f" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)"
            for v in $patched; do
              if newer "$v" "$old"; then advisories="$advisories $(basename "$f" .md)"; break; fi
            done
          done

          changed=false
          newer "$new" "$old" && changed=true
          [ -z "$advisories" ] || changed=true
          {
            echo "changed=$changed"
            echo "old=$old"
            echo "new=$new"
          } >> "$GITHUB_OUTPUT"
          echo "vendored $old, newest stable $new, advisories patched after $old:${advisories:- none}"
          [ "$changed" = true ] || exit 0

          {
            echo "The vendored pulldown-cmark core is at \`$old\` (crates/rubrica-markdown/UPSTREAM)."
            echo
            echo "- newest stable on crates.io: \`$new\`"
            if [ -n "$advisories" ]; then
              echo "- RustSec advisories patched after \`$old\`:"
              for a in $advisories; do echo "  - https://rustsec.org/advisories/$a.html"; done
            else
              echo "- no RustSec advisory is patched after \`$old\`"
            fi
            echo
            echo "Review the diff and port what applies by hand; do not merge it blind."
            if newer "$new" "$old"; then
              git clone --quiet https://github.com/pulldown-cmark/pulldown-cmark "$RUNNER_TEMP/upstream"
              echo
              echo "### \`git diff v$old v$new -- src/\` (truncated at 60 KB)"
              echo
              echo '~~~diff'
              git -C "$RUNNER_TEMP/upstream" diff "v$old" "v$new" -- src/ | head -c 60000
              echo
              echo '~~~'
            fi
          } > "$RUNNER_TEMP/issue-body.md"
      - name: Open or update the issue
        if: steps.cmp.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OLD: ${{ steps.cmp.outputs.old }}
          NEW: ${{ steps.cmp.outputs.new }}
        run: |
          set -euo pipefail
          title="upstream: pulldown-cmark $NEW (vendored $OLD)"
          # Create the label first: listing by a label that doesn't exist fails.
          gh label create upstream --repo "$GITHUB_REPOSITORY" --color 0E8A16 \
            --description "Upstream parser changes to review" 2>/dev/null || true
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label upstream \
            --search 'in:title "upstream: pulldown-cmark"' --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --repo "$GITHUB_REPOSITORY" --title "$title" \
              --body-file "$RUNNER_TEMP/issue-body.md"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label upstream \
              --body-file "$RUNNER_TEMP/issue-body.md"
          fi
