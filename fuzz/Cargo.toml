[package]
name = "rubrica-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# A developer tool outside the workspace: it never ships, and libFuzzer is C++ (the no-C rule
# covers the workspace's normal graph only).
[dependencies]
libfuzzer-sys = "0.4"
rubrica-markdown = { path = "../crates/rubrica-markdown" }
rubrica-render = { path = "../crates/rubrica-render" }
# the differential oracle, exact
pulldown-cmark = { version = "=0.13.6", default-features = false }

# Its own root: not a member of the repository's workspace.
[workspace]

[profile.release]
debug = 1

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "offsets"
path = "fuzz_targets/offsets.rs"
test = false
doc = false
bench = false

[[bin]]
name = "autolinks"
path = "fuzz_targets/autolinks.rs"
test = false
doc = false
bench = false

[[bin]]
name = "differential"
path = "fuzz_targets/differential.rs"
test = false
doc = false
bench = false

[[bin]]
name = "front_matter"
path = "fuzz_targets/front_matter.rs"
test = false
doc = false
bench = false
