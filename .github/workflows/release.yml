  release:
    name: GitHub release
    needs: [build, image, publish-bin]
    # After the crates are published; a candidate publishes none, so its skipped chain is fine.
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.image.result == 'success' && (needs.publish-bin.result == 'success' || (contains(github.ref_name, '-rc.') && needs.publish-bin.result == 'skipped')) }}
    runs-on: ubuntu-latest
    environment: release # requires the maintainer's approval
    permissions:
      contents: write # create the release
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notes
          path: notes
      - name: Create the release
        run: |
          set -euo pipefail
          version="${TAG#v}"
          shorts=(x86_64-linux-musl aarch64-linux-musl aarch64-apple-darwin)
          assets=()
          for short in "${shorts[@]}"; do
            name="rubrica-$version-$short"
            (cd dist && sha256sum -c "$name.tar.gz.sha256")
            assets+=("dist/$name.tar.gz" "dist/$name.tar.gz.sha256")
          done
          {
            cat notes/notes.md
            echo
            echo '## Platforms'
            echo
            echo '- Linux x86_64 and Linux aarch64: static binaries (musl), no libc needed.'
            echo '- macOS on Apple Silicon (aarch64-apple-darwin): best effort. The binary is unsigned and'
            echo '  not notarised, so macOS asks once before it runs.'
            echo
            echo '## Verify'
            echo
            echo 'Check the download against its attestation before you run it:'
            echo
            echo '```sh'
            for short in "${shorts[@]}"; do
              echo "gh attestation verify rubrica-$version-$short.tar.gz --repo $GITHUB_REPOSITORY"
            done
            echo '```'
            echo
            echo 'The container image (linux/amd64 and linux/arm64) has its own attestation:'
            echo
            echo '```sh'
            echo "gh attestation verify oci://ghcr.io/$GITHUB_REPOSITORY:$version --repo $GITHUB_REPOSITORY"
            echo '```'
          } > body.md
          flags=()
          case "$version" in *-rc.*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" \
            --notes-file body.md --verify-tag "${flags[@]}" "${assets[@]}"
