# Dependency-update pull requests, weekly: minor and patch grouped into one PR
# per ecosystem; majors separate, for their own review.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(cargo)"
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: "/tools/gen-font-widths"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "deps(cargo)"
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(actions)"
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
