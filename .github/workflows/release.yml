        env:
          # The first publish of a crate has no Trusted Publishing configuration yet: the owner
          # sets FIRST_PUBLISH_RUBRICA and the CRATES_IO_PUBLISH_NEW secret for one day.
          CARGO_REGISTRY_TOKEN: ${{ vars.FIRST_PUBLISH_RUBRICA == 'true' && secrets.CRATES_IO_PUBLISH_NEW || steps.auth.outputs.token }}
