[package]
name = "rubrica-wasm"
description = "The search page's script: the search index scored and written into the page, in Rust compiled to WebAssembly."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Never published: rubrica-wasm-bundle carries this crate's built output.
publish = false
repository.workspace = true

[lib]
# cdylib: the .wasm; rlib: the native tests of the pure part link against it.
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
# Only the interfaces the page uses: every feature adds bindings to the .wasm.
web-sys = { workspace = true, features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlOListElement",
    "Location",
    "UrlSearchParams",
    "Response",
    "Request",
    "RequestInit",
    "RequestCredentials",
    "Node",
    "Text",
] }
# The index is parsed from the response's text: pure Rust, no extra binding crate.
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
