[package]
name = "rubrica-markdown"
description = "Rubrica's Markdown parser: CommonMark 0.31.2 with GFM tables, strikethrough, task lists, footnotes and extended autolinks. The block and inline parsers derive from pulldown-cmark 0.13.6 (MIT)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "AGPL-3.0-only AND MIT"
repository.workspace = true
readme = "README.md"
keywords = ["markdown", "commonmark", "gfm", "parser"]
categories = ["parser-implementations", "text-processing"]

[dependencies]
