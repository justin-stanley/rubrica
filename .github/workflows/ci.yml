name: CI
# The gate. `Rust` runs scripts/ci.sh, the same script contributors run locally;
# the supply-chain, secret and language-specific checks are their own jobs so each
# is a required status check by name.
#
# This runs on pull requests from forks too: everything is GitHub-hosted, the token
# is read-only, and no secrets are used, so a fork's code can't reach anything.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Pinned tool versions, bumped deliberately (the Dependabot `cargo` group
  # does not see these).
  CARGO_DENY_VERSION: 0.20.2
  CARGO_AUDIT_VERSION: 0.22.2
  # actionlint, as the release's linux_amd64 tarball; the sha256 is from its checksums
  # file. Bump both together.
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
  # cargo-nextest, as the release's x86_64-unknown-linux-gnu tarball (a pre-built binary: a
  # `cargo install` would add minutes to each of the three jobs that run tests); the sha256
  # is from its release's .sha256 file. Bump both together.
  NEXTEST_VERSION: 0.9.151
  NEXTEST_SHA256: 1d4ce302b820c41f4b89c5fb9bce45f0f0c94882c1cf08fc360caf08be6e7df4

jobs:
  # The search page's wasm bundle, built once here with the pinned toolchain and the pinned
  # wasm-bindgen CLI (the version Cargo.toml pins for the crate; scripts/build-wasm.sh
  # refuses another). A second build from another target directory must give the same bytes
  # (scripts/wasm-reproducible.sh), the .wasm and the loader are held to their size budget,
  # and the embed is tested. Its files are never committed: the jobs that build
  # rubrica-site with its default features download them from here.
  #
  # The built bundle is cached (CI only: release.yml builds and attests its own and never
  # uses this cache). The key is every input of the bytes: the two crates (less the bundle
  # crate's git-ignored outputs), the root manifest (the wasm profile and the pins) and
  # Cargo.lock, the toolchain file, the CLI's version, the two scripts and this file. On a hit
  # the toolchain, the target, the CLI and both builds are skipped; the checks that need no
  # build still run (scripts/wasm-bundle-check.sh: the size budgets, the sha256 recorded when
  # the entry was made, the CLI's version) and the artifact is uploaded as ever. On a miss the
  # job is what it was: the build, the second build that must give the same bytes, the embed
  # test; the entry is saved when the job succeeds. No restore-keys: an older entry is never
  # taken for this one.
  wasm:
    name: wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: wasm-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            crates/rubrica-wasm-bundle/src/rubrica-search_bg.wasm
            crates/rubrica-wasm-bundle/src/rubrica-search.js
            crates/rubrica-wasm-bundle/src/meta.rs
            target/wasm-bundle.sha256
          key: wasm-bundle-v1-${{ runner.os }}-bindgen-0.2.126-${{ hashFiles('crates/rubrica-wasm/**', 'crates/rubrica-wasm-bundle/**', '!crates/rubrica-wasm-bundle/src/*.js', '!crates/rubrica-wasm-bundle/src/*.wasm', '!crates/rubrica-wasm-bundle/src/meta.rs', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'scripts/build-wasm.sh', 'scripts/wasm-reproducible.sh', '.github/workflows/ci.yml') }}
      # No `toolchain:` input: the action honours rust-toolchain.toml (1.97.0). The target is
      # added to that toolchain, the one cargo runs here.
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        if: steps.wasm-cache.outputs.cache-hit != 'true'
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        if: steps.wasm-cache.outputs.cache-hit != 'true'
      - name: The wasm target and the wasm-bindgen CLI, pinned
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli@0.2.126 --locked
      - name: Build the bundle; a second build gives the same bytes
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          scripts/build-wasm.sh --bundle
          scripts/wasm-reproducible.sh
      # What goes in the cache entry beside the files: their sha256, checked on a hit.
      - name: Record the bundle's checksums for the cache entry
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: scripts/wasm-bundle-check.sh --write
      - name: The bundle crate, and the site that embeds it
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: cargo test --locked -p rubrica-wasm-bundle -p rubrica-site
      # The checks a restored bundle gets, which need no build. (The embed is tested by the
      # `Rust` job on every run: the workspace's tests include these two crates.)
      - name: Check the cached bundle
        if: steps.wasm-cache.outputs.cache-hit == 'true'
        run: scripts/wasm-bundle-check.sh --verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wasm-bundle
          path: |
            crates/rubrica-wasm-bundle/src/rubrica-search_bg.wasm
            crates/rubrica-wasm-bundle/src/rubrica-search.js
            crates/rubrica-wasm-bundle/src/meta.rs
          if-no-files-found: error
          retention-days: 7

  rust:
    name: Rust
    needs: wasm
    runs-on: ubuntu-latest
    env:
      # scripts/run-tests.sh fails, rather than fall back to `cargo test`, without nextest.
      RUBRICA_REQUIRE_NEXTEST: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # The wasm job's bundle: rubrica-site embeds it by default, and it is never committed.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-bundle
          path: crates/rubrica-wasm-bundle/src
      # No `toolchain:` input: the action honours rust-toolchain.toml (1.97.0).
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
      # tools/public-workflows-check.sh (run by the gate) lints the workflows with actionlint.
      - name: Install actionlint
        run: |
          set -euo pipefail
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL "$url" -o /tmp/actionlint.tar.gz
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          install -m 0755 /tmp/actionlint "$RUNNER_TEMP/actionlint"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Install cargo-nextest
        run: |
          set -euo pipefail
          url="https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-${NEXTEST_VERSION}/cargo-nextest-${NEXTEST_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSfL "$url" -o /tmp/nextest.tar.gz
          echo "${NEXTEST_SHA256}  /tmp/nextest.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/nextest"
          tar -xzf /tmp/nextest.tar.gz -C "$RUNNER_TEMP/nextest" cargo-nextest
          echo "$RUNNER_TEMP/nextest" >> "$GITHUB_PATH"
      - name: scripts/ci.sh
        env:
          RUBRICA_CI_SPLIT: "1" # deny and audit run as their own jobs below
        run: scripts/ci.sh

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    env:
      # rust-toolchain.toml pins the newest toolchain, and rustup honours that
      # file over whatever is installed; this override is what makes the job
      # test the MSRV. Keep it equal to `rust-version` in Cargo.toml (the first
      # step fails if it drifts).
      RUSTUP_TOOLCHAIN: "1.94"
      # scripts/run-tests.sh fails, rather than fall back to `cargo test`, without nextest.
      RUBRICA_REQUIRE_NEXTEST: "1"
    needs: wasm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # The wasm job's bundle: rubrica-site embeds it by default, and it is never committed.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-bundle
          path: crates/rubrica-wasm-bundle/src
      - name: The override equals rust-version in Cargo.toml
        run: |
          set -euo pipefail
          declared="$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)"
          [ "$declared" = "1.94" ] || { echo "::error::Cargo.toml says rust-version $declared; update this job"; exit 1; }
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.94"
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
      # The release binary is not built with the MSRV: it asks cargo (the 1.94 one here) to
      # build the tests, then runs the binaries cargo built.
      - name: Install cargo-nextest
        run: |
          set -euo pipefail
          url="https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-${NEXTEST_VERSION}/cargo-nextest-${NEXTEST_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSfL "$url" -o /tmp/nextest.tar.gz
          echo "${NEXTEST_SHA256}  /tmp/nextest.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/nextest"
          tar -xzf /tmp/nextest.tar.gz -C "$RUNNER_TEMP/nextest" cargo-nextest
          echo "$RUNNER_TEMP/nextest" >> "$GITHUB_PATH"
      - name: Build and test on the MSRV
        run: |
          set -euo pipefail
          rustc --version | grep -F ' 1.94.'
          cargo build --locked --all-features
          scripts/run-tests.sh

  spec:
    name: spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
      - name: CommonMark and GFM spec examples
        run: cargo test --locked -p rubrica-markdown --test spec

  # Coverage, measured in house. cargo-llvm-cov runs the workspace's tests with instrumented
  # builds. scripts/coverage-summary.sh turns its JSON into the run's summary page (a table per
  # crate, lowest first, then a per-file table for each) and holds every crate to its floor in
  # coverage-floor.toml: the last step fails the job when a crate is more than 0.5 points below
  # its floor or has none. The HTML report is kept as an artifact, and on a push to main
  # (never a pull request) it is also staged as a script-free site, which `coverage-pages`
  # publishes to GitHub Pages. Nothing leaves GitHub but that: no coverage service, no upload
  # to one, no credential. It is a report with floors, not a required check. The tool's version
  # is bumped deliberately.
  coverage:
    name: coverage
    needs: wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # The wasm job's bundle: rubrica-site embeds it by default, and it is never committed.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-bundle
          path: crates/rubrica-wasm-bundle/src
      # No `toolchain:` input: the action honours rust-toolchain.toml (1.97.0). The component
      # is added to that toolchain, the one cargo runs here.
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
      - name: llvm-tools and cargo-llvm-cov, pinned
        run: |
          set -euo pipefail
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov@0.9.1 --locked
      - name: Install cargo-nextest
        run: |
          set -euo pipefail
          url="https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-${NEXTEST_VERSION}/cargo-nextest-${NEXTEST_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSfL "$url" -o /tmp/nextest.tar.gz
          echo "${NEXTEST_SHA256}  /tmp/nextest.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/nextest"
          tar -xzf /tmp/nextest.tar.gz -C "$RUNNER_TEMP/nextest" cargo-nextest
          echo "$RUNNER_TEMP/nextest" >> "$GITHUB_PATH"
      # Under nextest (doctests are not measured). cargo-llvm-cov has a --profile of its own,
      # cargo's, so the nextest profile is chosen in the environment.
      - name: Run the workspace's tests, instrumented
        env:
          NEXTEST_PROFILE: ci
        run: cargo llvm-cov nextest --workspace --all-features --locked --no-report
      - name: Build the reports
        run: |
          set -euo pipefail
          cargo llvm-cov report --html
          cargo llvm-cov report --json --summary-only --output-path target/llvm-cov/summary.json
      # The summary first: it fails the job for a crate below its floor (or without one), after
      # writing the table and the badge file. The steps after it still run for the artifact.
      - name: Summary and floors
        run: |
          set -euo pipefail
          scripts/coverage-summary.sh target/llvm-cov/summary.json coverage-floor.toml --badge target/llvm-cov/badge.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage-html
          path: target/llvm-cov/html
          if-no-files-found: error
          retention-days: 14
      # Pull requests do not publish, and neither does a run whose floors failed: the site is
      # staged only on a push to main, after the summary step succeeded.
      - name: Stage the Pages site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: scripts/coverage-site.sh target/llvm-cov/html target/llvm-cov/badge.json target/pages
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: target/pages

  # Publishes the coverage site to https://justin-stanley.github.io/rubrica/ on a push to main,
  # after the coverage job (so after its floors held). The only job with `pages: write` and
  # `id-token: write`, and it runs no code of the repository's: one step, the official deploy
  # action, which publishes the artifact the coverage job uploaded.
  coverage-pages:
    name: coverage-pages
    needs: coverage
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  linear:
    name: linear
    needs: wasm
    runs-on: ubuntu-latest
    env:
      # Shared runners are noisy: the linear tests then take the best of five runs and
      # allow up to 3.0x per doubling (2.5x and best of three elsewhere). Quadratic growth
      # shows about 4x, and the 2 s ceiling is unchanged.
      RUBRICA_LINEAR_CI: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # The wasm job's bundle: rubrica-site embeds it by default, and it is never committed.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-bundle
          path: crates/rubrica-wasm-bundle/src
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
      - name: Site build time is linear
        run: cargo test --locked -p rubrica-site --test linear --release
      - name: Parser time is linear
        run: |
          set -euo pipefail
          # tests/linear.rs of rubrica-markdown arrives later; a later change
          # removes this guard. The render-level linear.rs of rubrica-render
          # is wired in as a line here.
          if [ -d crates/rubrica-markdown ]; then
            cargo test --locked -p rubrica-markdown --test linear --release
          else
            echo "::notice::crates/rubrica-markdown does not exist yet; its linear test skipped"
          fi

  linear-arm64:
    # One check per shard, named "linear-arm64 (1/4)" to "linear-arm64 (4/4)": a required check
    # lists these four names, not "linear-arm64".
    name: linear-arm64 (${{ matrix.shard }})
    # The ratio tests of the parser and the renderer on an arm64 runner, natively: no emulation.
    runs-on: ubuntu-24.04-arm
    strategy:
      # One shard's failure must not hide another's.
      fail-fast: false
      matrix:
        # The release shape matrices cost most of the job's time; each shard runs the shapes at
        # index % 4 == i - 1 (tests/linear.rs of rubrica-render and of rubrica-markdown), both
        # profiles of a shape together.
        shard: ["1/4", "2/4", "3/4", "4/4"]
    env:
      # As in the linear job: the hosted-runner limits.
      RUBRICA_LINEAR_CI: "1"
      RUBRICA_LINEAR_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
      - name: Renderer and parser time are linear
        run: |
          set -euo pipefail
          cargo test --locked -p rubrica-render --test linear --release
          cargo test --locked -p rubrica-markdown --test linear --release

  no-js:
    name: no-js
    needs: wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # The wasm job's bundle: rubrica-site embeds it by default, and it is never committed.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-bundle
          path: crates/rubrica-wasm-bundle/src
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
      - name: No JavaScript in the repository or the output
        run: |
          set -euo pipefail
          scripts/no-js.sh

  # What crates.io would receive, for every crate that is published: the file list is the
  # committed PACKAGE-FILES, the .crate is under crates.io's size limit, and the unpacked
  # crate builds on its own. Nothing is published from here. The release workflow runs the
  # same script before each publish, against the crates published before it; here the
  # siblings are at a version crates.io does not hold yet (none, or the next release's), so
  # each is taken from its path.
  package:
    name: package
    needs: wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # The wasm job's bundle: the bundle crate packs it, and it is never committed.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-bundle
          path: crates/rubrica-wasm-bundle/src
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
      - name: Every crate packs to its PACKAGE-FILES and builds on its own
        run: |
          set -euo pipefail
          scripts/package-check.sh --patch-siblings rubrica-markdown
          scripts/package-check.sh --patch-siblings rubrica-render
          scripts/package-check.sh --patch-siblings rubrica-wasm-bundle
          scripts/package-check.sh --patch-siblings rubrica-site
          scripts/package-check.sh --patch-siblings rubrica

  cargo-deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2
        with:
          tool: cargo-deny@${{ env.CARGO_DENY_VERSION }}
      - run: cargo deny check bans licenses sources

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2
        with:
          tool: cargo-audit@${{ env.CARGO_AUDIT_VERSION }}
      # bincode 1.x via syntect's dump-load: the syntax dump is a build-time embedded blob, never input
      - run: cargo audit -D warnings --ignore RUSTSEC-2025-0141
      # tools/gen-font-widths is its own workspace with its own lock file, which the audit above never reads.
      - run: cargo audit -D warnings --file tools/gen-font-widths/Cargo.lock

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      # sha256 of gitleaks_<version>_linux_x64.tar.gz from the release's
      # checksums file. Bump both together.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # scan the whole history, not just the tree
          persist-credentials: false
      # The binary, not gitleaks-action: the action needs a licence key for some
      # accounts and does PR bookkeeping with the token; the binary needs neither.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "$url" -o /tmp/gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          install -m 0755 /tmp/gitleaks "$RUNNER_TEMP/gitleaks"
      - name: gitleaks (history and tree)
        run: '"$RUNNER_TEMP/gitleaks" git --redact --exit-code 1'
